[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-docx"
authors = [{name = "Steve Canny", email = "stcanny@gmail.com"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "lxml>=4.9.0",
    "typing_extensions>=4.9.0",
]
description = "Create, read, and update Microsoft Word .docx files."
dynamic = ["version"]
keywords = ["docx", "office", "openxml", "word"]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "Jinja2==2.11.3",
    "MarkupSafe==0.23",
    "Sphinx==1.8.6",
    "alabaster<0.7.14",
    "behave>=1.2.6",
    "mypy>=1.16.0",
    "pyparsing>=3.2.3",
    "pyright>=1.1.401",
    "pytest>=8.4.0",
    "ruff>=0.11.13",
    "tox>=4.26.0",
    "twine>=6.1.0",
    "types-lxml-multi-subclass>=2025.3.30",
]

[project.urls]
Changelog = "https://github.com/python-openxml/python-docx/blob/master/HISTORY.rst"
Documentation = "https://python-docx.readthedocs.org/en/latest/"
Homepage = "https://github.com/python-openxml/python-docx"
Repository = "https://github.com/python-openxml/python-docx"

[tool.pyright]
include = ["src/docx", "tests"]
pythonPlatform = "All"
pythonVersion = "3.10"
reportImportCycles = false
reportUnnecessaryCast = true
reportUnnecessaryTypeIgnoreComment = true
stubPath = "./typings"
typeCheckingMode = "strict"
verboseOutput = true
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
filterwarnings = [
    # -- exit on any warning not explicitly ignored here --
    "error",

    # -- pytest-xdist plugin may warn about `looponfailroots` deprecation --
    "ignore::DeprecationWarning:xdist",

    # -- pytest complains when pytest-xdist is not installed --
    "ignore:Unknown config option. looponfailroots:pytest.PytestConfigWarning",
]
looponfailroots = ["src", "tests"]
norecursedirs = [
    "doc",
    "docx",
    "*.egg-info",
    "features",
    ".git",
    "ref",
    "_scratch",
    ".tox",
]
python_files = ["test_*.py"]
python_classes = ["Test", "Describe"]
python_functions = ["it_", "its_", "they_", "and_", "but_"]

[tool.ruff]
exclude = []
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "COM812",   # -- over-aggressively insists on trailing commas where not desired --
    "PT001",    # -- wants @pytest.fixture() instead of @pytest.fixture --
]
select = [
    "C4",       # -- flake8-comprehensions --
    "COM",      # -- flake8-commas --
    "E",        # -- pycodestyle errors --
    "F",        # -- pyflakes --
    "I",        # -- isort (imports) --
    "PLR0402",  # -- Name compared with itself like `foo == foo` --
    "PT",       # -- flake8-pytest-style --
    "SIM",      # -- flake8-simplify --
    "UP015",    # -- redundant `open()` mode parameter (like "r" is default) --
    "UP018",    # -- Unnecessary {literal_type} call like `str("abc")`. (rewrite as a literal) --
    "UP032",    # -- Use f-string instead of `.format()` call --
    "UP034",    # -- Avoid extraneous parentheses --
    "W",        # -- pycodestyle warnings --
    # -- stricter rules, enforced only on modules already migrated (see per-file-ignores) --
    "ANN",      # -- flake8-annotations --
    "B",        # -- flake8-bugbear --
    "UP",       # -- pyupgrade --
]

[tool.ruff.lint.per-file-ignores]
# -- Ratchet: modules not yet modernized are exempt from the stricter rules. Add a module to
# -- this brace-list (and to the mypy override below) once it passes them.
"!src/docx/{text/paragraph}.py" = ["ANN", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["docx"]
known-local-folder = ["helpers"]

[tool.hatch.version]
path = "src/docx/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/features",
    "/docs",
    "/HISTORY.rst",
    "/tox.ini",
    "/requirements*.txt",
]
exclude = ["/docs/.build"]

[tool.hatch.build.targets.wheel]
packages = ["src/docx"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src:typings"
files = ["src/docx"]

[[tool.mypy.overrides]]
# -- Ratchet: errors are ignored in modules not yet modernized. List each module here once it
# -- passes `mypy --strict`; keep it in sync with the ruff per-file-ignores above.
module = ["docx.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["docx.text.paragraph"]
ignore_errors = false

